site_name: "LTRCOL-2011: AI by Design for Collaboration"
site_url: https://omerilyas.github.io/AibyDesign/
site_description: "Hands-on lab guide for Cisco Live US 2026. Exploring AI-powered features across Webex Messaging, Calling, Meetings, Customer Assist, Contact Center, Slido, and Vidcast."
site_author: Omer Ilyas
copyright: "Omer Ilyas (AI by Design)"

extra:
  generator: false
  social: []

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - attr_list
  - tables

extra_css:
  - css/custom.css

extra_javascript:
  - js/interactive-checkboxes.js
  - js/floating-notepad.js

plugins:
  - search

nav:
  - Home: index.md
  - About this Lab: about-this-lab.md

  - "Module 1: Setup your Lab Environment":
      - Overview: module-1-setup-your-lab-environment/index.md
      - "1a: Webex Developer Portal Setup": module-1-setup-your-lab-environment/module-1a-webex-developer-portal.md
      - "1b: Google Colab Setup": module-1-setup-your-lab-environment/module-1b-google-colab.md
      - "1c: Managing API Keys in Colab": module-1-setup-your-lab-environment/module-1c-managing-api-keys-in-colab.md
      - "1d: Introduction to Streamlit": module-1-setup-your-lab-environment/module-1d-introduction-to-streamlit.md
      - "1e: Introduction to ngrok": module-1-setup-your-lab-environment/module-1e-introduction-to-ngrok.md

  - "Module 2: LangChain for Messaging Intelligence":
      - Overview: module-2-langchain-for-messaging-intelligence/index.md
      - "2a: Connect LangChain to Webex Messaging": module-2-langchain-for-messaging-intelligence/module-2a-connect-langchain-to-webex-messaging.md
      - "2b: Ask Me Anything for Webex Spaces": module-2-langchain-for-messaging-intelligence/module-2b-ask-me-anything-webex-spaces.md
      - "2c: Generate Space Summaries": module-2-langchain-for-messaging-intelligence/module-2c-generate-space-summaries.md
      - "2d: AI Rewrite Assistant": module-2-langchain-for-messaging-intelligence/module-2d-ai-rewrite-assistant.md

  - Project Task Board: project-task-board.md
